<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Instagram Caption Generator</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
    input[type="file"] { display: none; }
    .upload-btn { background: #0095f6; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-block; }
    img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
    #result { margin-top: 20px; text-align: left; white-space: pre-wrap; font-size: 15px; line-height: 1.5; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #ddd; display: none; }
    .loader { display: none; margin-top: 15px; font-weight: bold; color: #555; }
  </style>
</head>
<body>

<div class="card">
  <h2>Auto Caption & Hashtags</h2>
  
  <label class="upload-btn">
    Ընտրել Նկարը
    <input type="file" id="imageInput" accept="image/*">
  </label>

  <img id="preview" alt="Preview">
  <div class="loader" id="loader">Վերլուծվում է նկարը... ⏳</div>
  <div id="result"></div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const preview = document.getElementById('preview');
  const loader = document.getElementById('loader');
  const result = document.getElementById('result');

  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    result.style.display = 'none';
    loader.style.display = 'block';

    const base64Image = await convertToBase64(file);
    
    try {
      const response = await fetch('/.netlify/functions/caption', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base64Data: base64Image })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0]) {
        loader.style.display = 'none';
        result.innerText = data.candidates[0].content.parts[0].text;
        result.style.display = 'block';
      } else {
        throw new Error(JSON.stringify(data));
      }
    } catch (err) {
      loader.style.display = 'none';
      result.innerText = "Սխալ տեղի ունեցավ API հարցումն անելիս:";
      result.style.display = 'block';
    }
  });

  function convertToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }
</script>

</body>
</html>
