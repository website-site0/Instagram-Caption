<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song HTML & Audio Generator</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #f4e4bc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; max-width: 650px; width: 100%; box-sizing: border-box; }
    h2 { color: #ffcc00; text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
    input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #444; background: #222; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    input[type="file"] { padding: 6px; }
    button.submit-btn { background: #ffcc00; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
    button.submit-btn:hover { background: #e6b800; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .copy-btn { background: #333; color: #ffcc00; border: 1px solid #ffcc00; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .copy-btn:hover { background: #ffcc00; color: #000; }
    textarea { width: 100%; height: 220px; background: #000; color: #00ff66; font-family: monospace; padding: 10px; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; margin-top: 5px; }
    .loader { display: none; text-align: center; margin-top: 15px; color: #ffcc00; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>Երգի HTML Գեներատոր (Աուդիոյով)</h2>

  <div class="form-group">
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
  </div>

  <div class="form-group">
    <label>Վերբեռնել Երգի Ֆայլը (.mp3, .wav)</label>
    <input type="file" id="audioFileInput" accept="audio/*">
  </div>

  <div class="form-group">
    <label>Երգի անուն</label>
    <input type="text" id="songTitle" placeholder="օր․ Զարթնիր Լաո">
  </div>

  <div class="form-group">
    <label>Կատարող / Երգիչ</label>
    <input type="text" id="artistName" placeholder="օր․ Գոհար Անսամբլ">
  </div>

  <div class="form-group">
    <label>Ֆայլի անուն կայքում (MP3)</label>
    <input type="text" id="fileName" placeholder="օր․ zartnir-lao.mp3">
  </div>

  <div class="form-group">
    <label>Տևողություն</label>
    <input type="text" id="duration" placeholder="օր․ 03:45">
  </div>

  <div class="form-group">
    <label>Ժանր</label>
    <input type="text" id="genre" placeholder="օր․ Ժողովրդական">
  </div>

  <div class="form-group">
    <label>Համարը ցանկում</label>
    <input type="text" id="songNumber" placeholder="օր․ 01">
  </div>

  <button class="submit-btn" onclick="generateSongCode()">Վերլուծել Աուդիոն և Գեներացնել 🚀</button>

  <div class="loader" id="loader">Լսվում է աուդիոն, գեներացվում են բառերն ու պատմությունը... ⏳</div>

  <div id="outputs" style="display: none;">
    <div class="output-header">
      <label>1. Ամբողջական HTML Էջ (song.html)</label>
      <button class="copy-btn" onclick="copyToClipboard('fullHtmlOutput')">Պատճենել HTML</button>
    </div>
    <textarea id="fullHtmlOutput" readonly></textarea>

    <div class="output-header">
      <label>2. Ցանկի Էլեմենտ (div.song-item)</label>
      <button class="copy-btn" onclick="copyToClipboard('itemHtmlOutput')">Պատճենել DIV</button>
    </div>
    <textarea id="itemHtmlOutput" style="height: 120px;" readonly></textarea>
  </div>
</div>

<script>
  if (localStorage.getItem('gemini_api_key')) {
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
  }

  function convertAudioToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  async function generateSongCode() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const audioFile = document.getElementById('audioFileInput').files[0];
    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('artistName').value.trim();
    const fileName = document.getElementById('fileName').value.trim();
    const duration = document.getElementById('duration').value.trim();
    const genre = document.getElementById('genre').value.trim() || "Ժողովրդական";
    const songNumber = document.getElementById('songNumber').value.trim() || "01";

    if (!apiKey || !title || !artist || !fileName || !duration) {
      alert("Խնդրում ենք լրացնել API Key-ը, երգի անունը, կատարողին, ֆայլի անունը և տևողությունը:");
      return;
    }

    localStorage.setItem('gemini_api_key', apiKey);
    document.getElementById('loader').style.display = 'block';
    document.getElementById('outputs').style.display = 'none';

    try {
      let promptText = `Provide detailed information for the Armenian song "${title}" by "${artist}". 
Format your output EXACTLY as a raw JSON object with no markdown formatting, no backticks, just valid JSON:
{
  "story": "A 100-word Armenian text about the history, meaning, and background of this song.",
  "lyrics": "The full lyrics of this song in Armenian."
}`;

      const contentsParts = [];

      if (audioFile) {
        const base64Audio = await convertAudioToBase64(audioFile);
        promptText = `Listen to the provided audio file for the song "${title}" by "${artist}". 
Listen carefully and transcribe the EXACT lyrics from the audio file into Armenian text. Also write a 100-word Armenian background/description about the song.
Format your output EXACTLY as a raw JSON object with no markdown formatting, no backticks, just valid JSON:
{
  "story": "A 100-word Armenian description and history of this song.",
  "lyrics": "The exact full transcribed lyrics in Armenian."
}`;

        contentsParts.push({ text: promptText });
        contentsParts.push({
          inline_data: {
            mime_type: audioFile.type || "audio/mp3",
            data: base64Audio
          }
        });
      } else {
        contentsParts.push({ text: promptText });
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: contentsParts }] })
      });

      const data = await response.json();

      if (data.error) {
        alert("Սխալ: " + data.error.message);
        return;
      }

      const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const songAiData = JSON.parse(rawText);

      buildCodes(title, artist, fileName, duration, genre, songNumber, songAiData.story, songAiData.lyrics);
    } catch (err) {
      alert("Սխալ տեղի ունեցավ հարցումն ուղարկելիս:");
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  }

  function buildCodes(title, artist, fileName, duration, genre, songNumber, story, lyrics) {
    const fullHtml = `<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .song-page-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            color: #f4e4bc;
        }
        .song-hero {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }
        .song-hero h2 { color: #ffcc00; font-size: 2.5rem; margin-bottom: 10px; }
        .lyrics-box {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            margin: 20px 0;
        }
        .lyrics-box pre {
            white-space: pre-wrap;
            font-family: inherit;
            line-height: 2;
            text-align: center;
            font-size: 1.1rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .download-btn { background: #ffcc00; color: #000; }
        .back-btn { border: 1px solid #ffcc00; color: #ffcc00; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
        
        audio {
            width: 100%;
            margin-top: 20px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }
        .main-header {
            width: 13%;
        }
    </style>
</head>
<body class="inner-page">

    <header class="main-header">
        <div class="logo">
            <span class="eternity-sign" onclick="window.location.href='song.html';">֎</span>
            <span class="logo-text" onclick="window.location.href='song.html';">${title}</span>
        </div>
    </header>

    <main class="song-page-container">
        <div class="song-hero">
            <h2>${title}</h2>
            <p>Կատարող՝ ${artist}</p>
            
            <audio controls>
                <source src="songs/${fileName}" type="audio/mpeg">
            </audio>
        </div>

        <div class="song-story">
            <h3 style="color: #ffcc00;">Երգի Նկարագրությունը</h3>
            <p>${story}</p>
        </div>

        <div class="lyrics-box">
            <h3 style="text-align: center; color: #888; margin-bottom: 20px;">Երգի Բառերը</h3>
            <pre>
${lyrics}
            </pre>
        </div>

        <div class="action-buttons">
            <a href="songs/${fileName}" download class="btn download-btn">📥 Ներբեռնել MP3</a>
            <a href="song.html" class="btn back-btn">⬅ Հետ դեպի ցանկ</a>
        </div>
    </main>

</body>
</html>`;

    const itemHtml = `<div class="song-item" data-src="songs/${fileName}" data-title="${title}" data-artist="${artist}" data-genre="${genre}">
    <div class="song-info">
        <span class="song-number">${songNumber}</span>
        <div class="song-details">
            <h3>${title}</h3>
            <p>${artist}</p>
        </div>
    </div> 
    <div class="song-controls">
        <button class="play-btn">▶</button>
        <span class="duration">${duration}</span>
    </div>
</div>`;

    document.getElementById('fullHtmlOutput').value = fullHtml;
    document.getElementById('itemHtmlOutput').value = itemHtml;
    document.getElementById('outputs').style.display = 'block';
  }

  function copyToClipboard(elementId) {
    const textarea = document.getElementById(elementId);
    textarea.select();
    document.execCommand('copy');
    alert('Կոդը պատճենվեց:');
  }
</script>

</body>
</html>
