<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Երգի ծնունդը — HTML Գեներատոր</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mardoto:wght@400;700;900&family=Noto+Sans+Armenian:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1c1720;
    --bg-panel:#251f2a;
    --bg-panel-2:#2c2531;
    --code-bg:#161119;
    --cream:#f4ecdd;
    --cream-dim:#c9bfae;
    --apricot:#f2994a;
    --apricot-dim:#b96f31;
    --carpet-red:#c1445a;
    --gold:#d4a24c;
    --line: rgba(244,236,221,0.14);
    --line-soft: rgba(244,236,221,0.08);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,162,76,0.10), transparent 60%),
      var(--bg-deep);
    color:var(--cream);
    font-family:'Noto Sans Armenian', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:92px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- Top nav ---------- */
  .top-nav{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
  }
  .nav-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bg-deep);
    background:linear-gradient(135deg, var(--gold), var(--apricot));
    padding:11px 22px;
    border-radius:30px;
    text-decoration:none;
    box-shadow:0 10px 24px -10px rgba(242,153,74,0.55);
    animation:navIn .55s cubic-bezier(.2,.9,.3,1.2) both;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .nav-btn:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 14px 30px -8px rgba(242,153,74,0.7);
  }
  .nav-btn:focus-visible{ outline:2px solid var(--cream); outline-offset:3px; }
  .nav-btn::before{
    content:'';
    position:absolute;
    inset:-5px;
    border-radius:34px;
    background:linear-gradient(135deg, var(--gold), var(--apricot));
    opacity:0.35;
    filter:blur(9px);
    z-index:-1;
    animation:navPulse 2.6s ease-in-out infinite;
  }
  .nav-btn svg{ width:15px; height:15px; }
  @keyframes navPulse{
    0%,100%{opacity:0.25; transform:scale(1);}
    50%{opacity:0.55; transform:scale(1.1);}
  }
  @keyframes navIn{
    from{opacity:0; transform:translateY(-14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .page{ width:100%; max-width:820px; }

  /* ---------- Ararat watermark ---------- */
  .ararat{ position:relative; height:64px; margin-bottom:8px; opacity:0.55; pointer-events:none; }
  .ararat svg{ width:100%; height:100%; display:block; }

  header{ text-align:center; margin-bottom:36px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--apricot);
    margin-bottom:14px;
  }
  .eyebrow::before, .eyebrow::after{ content:"✦"; margin:0 10px; color:var(--gold); opacity:0.8; }
  h1{
    font-family:'Mardoto', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 5.6vw, 48px);
    line-height:1.1;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  h1 .accent{ color:var(--apricot); }
  .sub{ color:var(--cream-dim); font-size:15px; max-width:460px; margin:0 auto; line-height:1.6; }

  /* ---------- Frame ---------- */
  .frame{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .corner{ position:absolute; width:34px; height:34px; opacity:0.85; }
  .corner svg{ width:100%; height:100%; }
  .corner.tl{ top:10px; left:10px; }
  .corner.tr{ top:10px; right:10px; transform:scaleX(-1); }
  .corner.bl{ bottom:10px; left:10px; transform:scaleY(-1); }
  .corner.br{ bottom:10px; right:10px; transform:scale(-1,-1); }

  /* ---------- Section labels ---------- */
  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    margin:28px 0 14px;
  }
  .section-label:first-child{ margin-top:0; }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line); }

  /* ---------- Fields ---------- */
  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
    margin-bottom:7px;
    display:block;
  }
  .form-row{ margin-bottom:16px; }
  .form-grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:16px;
  }
  @media(max-width:520px){ .form-grid2{ grid-template-columns:1fr; } }

  input[type="text"], input[type="password"]{
    width:100%;
    font-family:'Noto Sans Armenian', sans-serif;
    font-size:14px;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    padding:12px 14px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:#6f6577; }
  input:focus{ border-color:var(--apricot); box-shadow:0 0 0 3px rgba(242,153,74,0.18); }

  .key-row{ position:relative; }
  .key-row input{ padding-right:44px; font-family:'JetBrains Mono', monospace; }
  .key-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--cream-dim); cursor:pointer;
    padding:8px; display:flex; border-radius:6px;
  }
  .key-toggle:hover{ color:var(--apricot); }
  .key-toggle:focus-visible{ outline:2px solid var(--apricot); outline-offset:2px; }
  .key-note{
    font-size:12px; color:var(--cream-dim); opacity:0.75;
    margin-top:8px; display:flex; align-items:center; gap:6px;
  }

  /* ---------- Submit ---------- */
  .submit-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Mardoto', sans-serif;
    font-weight:700;
    font-size:15.5px;
    color:var(--bg-deep);
    background:linear-gradient(135deg, var(--gold), var(--apricot));
    border:none;
    padding:15px 20px;
    border-radius:12px;
    cursor:pointer;
    margin-top:26px;
    box-shadow:0 14px 30px -14px rgba(242,153,74,0.6);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .submit-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 36px -14px rgba(242,153,74,0.75); }
  .submit-btn:active{ transform:translateY(0); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
  .submit-btn svg{ width:17px; height:17px; }

  /* ---------- Loader ---------- */
  .loader-state{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:34px 18px;
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    margin-top:22px;
  }
  .vinyl{ width:46px; height:46px; animation:spin 2.4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loader-text{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--cream-dim); letter-spacing:0.03em; }
  .loader-text .dots::after{ content:''; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }

  /* ---------- Error ---------- */
  .error-box{
    display:none; align-items:flex-start; gap:10px;
    border:1px solid rgba(193,68,90,0.5);
    background:rgba(193,68,90,0.12);
    color:#f2c3cd;
    padding:14px 16px;
    border-radius:var(--radius);
    font-size:13.5px;
    line-height:1.6;
    margin-top:22px;
  }
  .error-box svg{ width:18px; height:18px; flex-shrink:0; margin-top:1px; color:var(--carpet-red); }

  /* ---------- Outputs ---------- */
  .outputs{ display:none; margin-top:30px; }
  .tabs{
    display:inline-flex;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:30px;
    padding:4px;
    gap:4px;
    margin-bottom:14px;
  }
  .tab-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    background:none;
    border:none;
    color:var(--cream-dim);
    padding:8px 16px;
    border-radius:24px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background:linear-gradient(135deg, var(--gold), var(--apricot));
    color:var(--bg-deep);
    font-weight:600;
  }

  .code-panel{ display:none; }
  .code-panel.active{ display:block; }
  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .code-head .field-label{ margin:0; }
  .copy-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    display:flex; align-items:center; gap:6px;
    background:none;
    border:1px solid var(--line);
    color:var(--cream-dim);
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .copy-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .copy-btn svg{ width:13px; height:13px; }

  .code-box{
    position:relative;
    background:var(--code-bg);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .code-box::before{
    content:'';
    display:block;
    height:30px;
    background:#1d1721;
    border-bottom:1px solid var(--line);
  }
  .code-box::after{
    content:'● ● ●';
    position:absolute;
    top:8px; left:12px;
    font-size:10px;
    letter-spacing:4px;
    color:#4a4152;
  }
  textarea{
    width:100%;
    height:260px;
    background:transparent;
    color:#8ee6a8;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    padding:14px;
    border:none;
    resize:vertical;
    outline:none;
  }
  #itemHtmlOutput{ height:130px; }

  footer{
    text-align:center; margin-top:26px; font-size:11.5px;
    color:var(--cream-dim); opacity:0.6;
    font-family:'JetBrains Mono', monospace; letter-spacing:0.04em;
  }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--gold); color:var(--bg-deep);
    font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:500;
    padding:10px 18px; border-radius:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav class="top-nav">
  <a class="nav-btn" href="instagram-caption-generator.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M21 17l-5.5-5-4 4L9 14l-6 6"/></svg>
    Նկար
  </a>
</nav>

<div class="page">

  <div class="ararat" aria-hidden="true">
    <svg viewBox="0 0 820 64" preserveAspectRatio="none">
      <polygon points="0,64 190,10 260,64" fill="#2c2531"/>
      <polygon points="230,64 340,-4 420,64" fill="#332b3a"/>
      <polygon points="600,64 700,18 820,64" fill="#2c2531"/>
      <polygon points="315,-4 340,-4 355,18 300,18" fill="#f4ecdd" opacity="0.5"/>
    </svg>
  </div>

  <header>
    <div class="eyebrow">Ձայնագրության լաբորատորիա</div>
    <h1>Երգի <span class="accent">ծնունդը</span></h1>
    <p class="sub">Լրացրու երգի տվյալները — AI-ն կգրի պատմությունն ու բառերը, դու կստանաս պատրաստ էջի կոդը։</p>
  </header>

  <div class="frame">
    <div class="corner tl"><svg viewBox="0 0 34 34"><path d="M1 1 L1 20 M1 1 L20 1 M1 9 Q1 1 9 1" stroke="#d4a24c" stroke-width="1.4" fill="none"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 34 34"><path d="M1 1 L1 20 M1 1 L20 1 M1 9 Q1 1 9 1" stroke="#d4a24c" stroke-width="1.4" fill="none"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 34 34"><path d="M1 1 L1 20 M1 1 L20 1 M1 9 Q1 1 9 1" stroke="#d4a24c" stroke-width="1.4" fill="none"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 34 34"><path d="M1 1 L1 20 M1 1 L20 1 M1 9 Q1 1 9 1" stroke="#d4a24c" stroke-width="1.4" fill="none"/></svg></div>

    <div class="section-label">Gemini API</div>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="AIzaSy...">
      <button class="key-toggle" id="keyToggle" type="button" aria-label="Ցույց տալ բանալին">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="key-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Բանալին պահվում է միայն քո բրաուզերում
    </div>

    <div class="section-label">Երգի ինքնությունը</div>
    <div class="form-row">
      <label class="field-label">ԵՐԳԻ ԱՆՈՒՆ</label>
      <input type="text" id="songTitle" placeholder="օր․ Դուք խոսեք լեռներ">
    </div>
    <div class="form-row">
      <label class="field-label">ԿԱՏԱՐՈՂ / ԵՐԳԻՉ</label>
      <input type="text" id="artistName" placeholder="օր․ Գաթա Բենդ">
    </div>

    <div class="section-label">Ֆայլի տվյալներ</div>
    <div class="form-grid2">
      <div>
        <label class="field-label">ՖԱՅԼԻ ԱՆՈՒՆ (MP3)</label>
        <input type="text" id="fileName" placeholder="օր․ xoseqlerner.mp3">
      </div>
      <div>
        <label class="field-label">ՏԵՎՈՂՈՒԹՅՈՒՆ</label>
        <input type="text" id="duration" placeholder="օր․ 3:57">
      </div>
      <div>
        <label class="field-label">ԺԱՆՐ</label>
        <input type="text" id="genre" placeholder="օր․ Ժողովրդական">
      </div>
      <div>
        <label class="field-label">ՀԱՄԱՐԸ ՑԱՆԿՈՒՄ</label>
        <input type="text" id="songNumber" placeholder="օր․ 58">
      </div>
    </div>

    <button class="submit-btn" id="generateBtn" onclick="generateSongCode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      Գեներացնել
    </button>

    <div class="loader-state" id="loader">
      <svg class="vinyl" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#d4a24c" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="6.2" stroke="#f2994a" stroke-width="1.2" stroke-dasharray="2 2"/>
        <circle cx="12" cy="12" r="1.6" fill="#f2994a"/>
      </svg>
      <div class="loader-text">Ստեղծվում են բառերն ու պատմությունը<span class="dots"></span></div>
    </div>

    <div class="error-box" id="errorBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
      <span id="errorText"></span>
    </div>

    <div class="outputs" id="outputs">
      <div class="tabs">
        <button class="tab-btn active" id="tabFull" type="button" onclick="switchTab('full')">song.html</button>
        <button class="tab-btn" id="tabItem" type="button" onclick="switchTab('item')">ցանկի բլոկ</button>
      </div>

      <div class="code-panel active" id="panelFull">
        <div class="code-head">
          <label class="field-label">ԱՄԲՈՂՋԱԿԱՆ ԷՋ</label>
          <button class="copy-btn" onclick="copyToClipboard('fullHtmlOutput')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></svg>
            Պատճենել
          </button>
        </div>
        <div class="code-box"><textarea id="fullHtmlOutput" readonly></textarea></div>
      </div>

      <div class="code-panel" id="panelItem">
        <div class="code-head">
          <label class="field-label">ՑԱՆԿԻ ԷԼԵՄԵՆՏ</label>
          <button class="copy-btn" onclick="copyToClipboard('itemHtmlOutput')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></svg>
            Պատճենել
          </button>
        </div>
        <div class="code-box"><textarea id="itemHtmlOutput" readonly></textarea></div>
      </div>
    </div>
  </div>

  <footer>Nano Banana · Gemini-ով</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const keyToggle = document.getElementById('keyToggle');
  const generateBtn = document.getElementById('generateBtn');
  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  const outputs = document.getElementById('outputs');
  const toast = document.getElementById('toast');

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }

  keyToggle.addEventListener('click', () => {
    apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function showError(msg){
    errorText.textContent = msg;
    errorBox.style.display = 'flex';
  }
  function hideError(){ errorBox.style.display = 'none'; }

  function switchTab(which){
    document.getElementById('tabFull').classList.toggle('active', which === 'full');
    document.getElementById('tabItem').classList.toggle('active', which === 'item');
    document.getElementById('panelFull').classList.toggle('active', which === 'full');
    document.getElementById('panelItem').classList.toggle('active', which === 'item');
  }

  async function generateSongCode() {
    const apiKey = apiKeyInput.value.trim();
    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('artistName').value.trim();
    const fileName = document.getElementById('fileName').value.trim();
    const duration = document.getElementById('duration').value.trim();
    const genre = document.getElementById('genre').value.trim() || "Ժողովրդական";
    const songNumber = document.getElementById('songNumber').value.trim() || "01";

    hideError();

    if (!apiKey || !title || !artist || !fileName || !duration) {
      showError("Խնդրում ենք լրացնել API Key-ը, երգի անունը, կատարողին, ֆայլի անունը և տևողությունը։");
      return;
    }

    localStorage.setItem('gemini_api_key', apiKey);
    loader.style.display = 'flex';
    outputs.style.display = 'none';
    generateBtn.disabled = true;

    const promptText = `Provide the full Armenian lyrics and a 100-word Armenian description for the song "${title}" by "${artist}". 
Format your output EXACTLY as a JSON object with no markdown formatting, no code block backticks:
{
  "story": "Around 100 Armenian words describing the history, theme, and meaning of the song.",
  "lyrics": "Full lyrics in Armenian text."
}`;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });

      const data = await response.json();

      if (data.error) {
        showError("Սխալ. " + data.error.message);
        return;
      }

      const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const songAiData = JSON.parse(rawText);

      buildCodes(title, artist, fileName, duration, genre, songNumber, songAiData.story, songAiData.lyrics);
      outputs.style.display = 'block';
      switchTab('full');
    } catch (err) {
      showError("Սխալ տեղի ունեցավ տվյալները ստանալիս։ Փորձիր կրկին։");
    } finally {
      loader.style.display = 'none';
      generateBtn.disabled = false;
    }
  }

  function buildCodes(title, artist, fileName, duration, genre, songNumber, story, lyrics) {
    const fullHtml = `<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .song-page-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            color: #f4e4bc;
        }
        .song-hero {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }
        .song-hero h2 { color: #ffcc00; font-size: 2.5rem; margin-bottom: 10px; }
        .lyrics-box {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            margin: 20px 0;
        }
        .lyrics-box pre {
            white-space: pre-wrap;
            font-family: inherit;
            line-height: 2;
            text-align: center;
            font-size: 1.1rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .download-btn { background: #ffcc00; color: #000; }
        .back-btn { border: 1px solid #ffcc00; color: #ffcc00; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
        
        audio {
            width: 100%;
            margin-top: 20px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }
        .main-header {
            width: 13%;
        }
    </style>
</head>
<body class="inner-page">

    <header class="main-header">
        <div class="logo">
            <span class="eternity-sign" onclick="window.location.href='song.html';">֎</span>
            <span class="logo-text" onclick="window.location.href='song.html';">${title}</span>
        </div>
    </header>

    <main class="song-page-container">
        <div class="song-hero">
            <h2>${title}</h2>
            <p>Կատարող՝ ${artist}</p>
            
            <audio controls>
                <source src="songs/${fileName}" type="audio/mpeg">
            </audio>
        </div>

        <div class="song-story">
            <h3 style="color: #ffcc00;">Երգի Նկարագրությունը</h3>
            <p>${story}</p>
        </div>

        <div class="lyrics-box">
            <h3 style="text-align: center; color: #888; margin-bottom: 20px;">Երգի Բառերը</h3>
            <pre>
${lyrics}
            </pre>
        </div>

        <div class="action-buttons">
            <a href="songs/${fileName}" download class="btn download-btn">📥 Ներբեռնել MP3</a>
            <a href="song.html" class="btn back-btn">⬅ Հետ դեպի ցանկ</a>
        </div>
    </main>

</body>
</html>`;

    const itemHtml = `<div class="song-item" data-src="songs/${fileName}" data-title="${title}" data-artist="${artist}" data-genre="${genre}">
    <div class="song-info">
        <span class="song-number">${songNumber}</span>
        <div class="song-details">
            <h3>${title}</h3>
            <p>${artist}</p>
        </div>
    </div> 
    <div class="song-controls">
        <button class="play-btn">▶</button>
        <span class="duration">${duration}</span>
    </div>
</div>`;

    document.getElementById('fullHtmlOutput').value = fullHtml;
    document.getElementById('itemHtmlOutput').value = itemHtml;
  }

  function copyToClipboard(elementId) {
    const textarea = document.getElementById(elementId);
    textarea.select();
    document.execCommand('copy');
    showToast('Կոդը պատճենվեց');
  }
</script>

</body>
</html>
